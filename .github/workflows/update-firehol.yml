name: Update FireHOL Level 1

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download FireHOL Level 1
        run: |
          curl -f -o firehol_level1.netset https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset || exit 0

      - name: Convert to MikroTik format
        run: |
          echo "" > firehol_mikrotik.rsc
          while IFS= read -r line; do
            if [[ "$line" =~ "/" ]] && [[ ! "$line" =~ "#" ]]; then
              echo "/ip firewall address-list add list=global_Blacklist address=$line" >> firehol_mikrotik.rsc
            fi
          done < firehol_level1.netset

      - name: Commit only if changed
        run: |
          if git status --porcelain | grep firehol_mikrotik.rsc; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add firehol_mikrotik.rsc
            git commit -m "Update FireHOL Level 1"
            git push
          else
            echo "No changes in FireHOL list."
          fi
