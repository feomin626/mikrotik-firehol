name: Update FireHOL Level 1

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download FireHOL Level 1
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            -o firehol_level1.netset \
            https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset

          test -s firehol_level1.netset

      - name: Convert to MikroTik format
        run: |
          set -euo pipefail

          : > firehol_mikrotik.rsc

          while IFS= read -r line; do
            if [[ "$line" =~ "/" ]] && [[ ! "$line" =~ "#" ]]; then
              echo "/ip firewall address-list add list=global_Blacklist_NEW address=$line" >> firehol_mikrotik.rsc
            fi
          done < firehol_level1.netset

          COUNT=$(grep -c '^/ip firewall address-list add' firehol_mikrotik.rsc)

          echo "Generated entries: $COUNT"

          if [ "$COUNT" -lt 1000 ]; then
            echo "FireHOL list looks incomplete - refusing to continue"
            exit 1
          fi

      - name: Commit only if changed
        run: |
          set -euo pipefail

          if git status --porcelain | grep -q firehol_mikrotik.rsc; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"

            git add firehol_mikrotik.rsc
            git commit -m "Update FireHOL Level 1"
            git push
          else
            echo "No changes in FireHOL list."
          fi
